<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="manifest" href="./manifest.json">
        <title>Lokcal</title>
        <!-- Kotlin/Wasm emits bare npm specifiers (e.g. kotlinx-datetime -> '@js-joda/core').
             Browsers need an import map to resolve them; the bundler step that would
             normally do this is missing from Kotlin Toolchain 0.11.0. See assemble-web.sh. -->
        <script type="importmap">
            { "imports": { "@js-joda/core": "./js-joda.mjs" } }
        </script>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body></body>
    <script type="module" src="webApp.mjs"></script>
</html>
