tasks:
  assembleWeb:
    action: !com.emilflach.lokcal.plugins.webdist.assembleWeb
      moduleRootDir: ${module.rootDir}
  serveWeb:
    action: !com.emilflach.lokcal.plugins.webdist.serveWeb
      moduleRootDir: ${module.rootDir}
      settings: ${pluginSettings}

commands:
  - assembleWeb
  - serveWeb
